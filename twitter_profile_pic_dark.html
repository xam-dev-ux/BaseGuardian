<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseGuardian - Profile Dark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 4px solid #0052FF;
        }

        /* Glowing gradient background */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 50%, rgba(0, 82, 255, 0.4) 0%, transparent 70%),
                radial-gradient(circle at 30% 70%, rgba(0, 212, 255, 0.3) 0%, transparent 60%);
        }

        /* Shield */
        .shield {
            position: relative;
            z-index: 10;
            font-size: 180px;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.8));
        }

        /* Animated rings */
        .orbit {
            position: absolute;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        .orbit1 {
            width: 90%;
            height: 90%;
            border-style: dashed;
        }

        .orbit2 {
            width: 75%;
            height: 75%;
            animation-duration: 15s;
            animation-direction: reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Corner accents */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid #00D4FF;
            border-radius: 50%;
        }

        .corner1 {
            top: 50px;
            left: 50px;
            border-right: none;
            border-bottom: none;
        }

        .corner2 {
            bottom: 50px;
            right: 50px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-glow"></div>
        <div class="orbit orbit1"></div>
        <div class="orbit orbit2"></div>
        <div class="corner corner1"></div>
        <div class="corner corner2"></div>
        <div class="shield">🛡️</div>
    </div>
</body>
</html>
