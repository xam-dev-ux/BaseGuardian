<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseGuardian - Profile Picture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0052FF 0%, #00D4FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 82, 255, 0.6);
        }

        /* Animated background */
        .bg-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(0, 0, 0, 0.2) 0%, transparent 40%);
        }

        /* Shield icon */
        .shield {
            position: relative;
            z-index: 10;
            font-size: 180px;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }

        /* Glow effect */
        .glow {
            position: absolute;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Ring decoration */
        .ring {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .ring1 {
            width: 85%;
            height: 85%;
        }

        .ring2 {
            width: 70%;
            height: 70%;
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-pattern"></div>
        <div class="glow"></div>
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="shield">🛡️</div>
    </div>
</body>
</html>
